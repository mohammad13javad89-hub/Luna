<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>تسویه حساب | LUNA</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">LUNA</div>

      <a href="index.html"> بازگشت به فروشگاه </a>
    </header>

    <main class="checkout-page">
      <h1>تکمیل سفارش</h1>

      <p>لطفاً اطلاعات خود را وارد کنید.</p>


      <section class="checkout-form-section">
        <h2>اطلاعات خریدار</h2>

        <form id="checkoutForm">
          <label for="customerName"> نام و نام خانوادگی </label>

          <input type="text" id="customerName" required />

          <label for="customerPhone"> شماره تماس </label>

          <input type="tel" id="customerPhone" inputmode="numeric" maxlength="11" placeholder="09123456789" required />

          <label for="customerProvince"> استان </label>

          <input type="text" id="customerProvince" required />

          <label for="customerCity"> شهر </label>

          <input type="text" id="customerCity" required />

          <label for="customerAddress"> آدرس کامل </label>

          <textarea id="customerAddress" required></textarea>

          <label for="postalCode"> کد پستی </label>

          <input type="text" id="postalCode" inputmode="numeric" maxlength="10" required />

          <button type="submit">ثبت و ادامه سفارش</button>
        </form>
      </section>


      <section class="checkout-summary">
        <h2>خلاصه سفارش</h2>

        <div id="checkoutItems"></div>

        <div class="checkout-total">
          <span>مبلغ قابل پرداخت:</span>

          <strong id="checkoutTotal"> ۰ تومان </strong>
        </div>
      </section>
    </main>

    <script src="products.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
